name: Frontend CI

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: bun install --frozen-lockfile

      - name: Lint
        if: ${{ hashFiles('package.json') != '' }}
        run: bun lint

      - name: Typecheck
        if: ${{ hashFiles('package.json') != '' }}
        run: bun typecheck

      - name: Build
        if: ${{ hashFiles('package.json') != '' }}
        run: bunx next build

      - name: Skip notice
        if: ${{ hashFiles('package.json') == '' }}
        run: echo "No package.json yet. Skipping frontend CI."
